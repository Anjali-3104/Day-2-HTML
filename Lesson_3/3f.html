<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3f</title>

    <style>

        .amazon-link{

           color: rgb(0, 113, 133); 
        }

        .amazon-link:hover{
            color: rgb(199, 81, 31);
        }
        .title{
            font-size: 24px;
            font-weight: bold;
        }
        .price{
            color: rgb(0, 118, 0);
            font-weight: bold;
        }
        
        .Add{
            background-color: rgb(255, 216, 20);
            color: black;
            border: none;
            border-radius: 15px;
            height: 30px;
            width: 110px;
            margin-right: 8px;
            cursor: pointer;
            
        }

        .Add:hover{
            background-color: rgb(247, 202, 0);
        }
        .Add:active{
            opacity: 0.5;
        }

        .Buy{
            background-color: rgb(255, 164, 28);
            color: black;
            border: none;
            border-radius: 15px;
            height: 30px;
            width: 110px;
            cursor: pointer;
            
        }

        .Buy:hover{
            background-color: rgb(250, 137, 0);
        }

        .Buy:active{
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="amazon-link"><a href="http://amazon.com" target="_blank">
        Back to Amazon</div>
    
    </a>
    <div class="title"><p>Nike Black Running Shoes</p></div>
    <div class="price">$39 - in stock.</div>
    <p>Free delivery tomorrow.</p>
     <button class="Add">Add to cart</button>
     <button class="Buy">Buy now</button>
    
</body>
</html>
