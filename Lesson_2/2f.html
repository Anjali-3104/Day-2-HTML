<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2f</title>

    <style>
        .title{
            font-size: 24px;
            font-weight: bold;
        }
        .price{
            color: rgb(0, 118, 0);
            font-weight: bold;
        }
        
        .Add{
            background-color: rgb(255, 216, 20);
            color: black;
            border: none;
            border-radius: 15px;
            height: 30px;
            width: 110px;
            margin-right: 8px;
            cursor: pointer;
            
        }

        .Buy{
            background-color: rgb(255, 164, 28);
            color: black;
            border: none;
            border-radius: 15px;
            height: 30px;
            width: 110px;
            cursor: pointer;
            
        }
    </style>
</head>
<body>
    <a href="http://amazon.com" target="_blank">
        Back to Amazon
    </a>
    <div class="title"><p>Nike Black Running Shoes</p></div>
    <div class="price">$39 - in stock.</div>
    <p>Free delivery tomorrow.</p>
     <button class="Add">Add to cart</button>
     <button class="Buy">Buy now</button>
    
</body>
</html>
