<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap_buttons</title>

    <style>
        .get_started{
            background-color: rgb(121, 82, 179);
            color: white;
            border: none;
            border-radius: 3px;
            height: 30px;
            width: 110px;
            cursor: pointer;
        }

        .download{
            background-color: white;
            color: rgb(108, 117, 125);
            border: 1px;
            border-style: solid;
            border-color: black;
            border-radius: 3px;
            height: 30px;
            width: 110px;
            cursor: pointer;
        
        }
    </style>
</head>
<body>
    <button class="get_started">
        Get started
    </button>

    <button class="download">
        Download
    </button>
</body>
</html>
