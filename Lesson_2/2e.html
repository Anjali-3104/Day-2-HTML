<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn_buttons</title>

    <style>

        .apply_button{

            background-color: rgb(10, 102, 194);
            color: white;
            border: none;
            border-radius: 20px;
            height: 40px;
            width: 240px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-right: 8px;
            white-space: nowrap;
        }

        .save{
            background-color: white;
            color: rgb(10, 102, 194);
            border-width: 1px;
            border-style: solid;
            border-radius: 20px;
            border-color: rgb(10, 102, 194);
            height: 40px;
            width: 80px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button class="apply_button">Apply on company website</button>
    <button class="save">Save</button>
</body>
</html>
