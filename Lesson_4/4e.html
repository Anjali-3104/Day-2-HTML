<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4e</title>

    <style>

        .apply_button{

            background-color: rgb(10, 102, 194);
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            padding-top: 11px;
            padding-bottom: 11px;
            padding-left: 24px;
            padding-right: 24px;
            font-size: 15px;
            cursor: pointer;
            margin-right: 8px;
            white-space: nowrap;
        }

        .apply_button:hover{
            background-color: rgb(2, 70, 138);
        }
        .save{
            background-color: white;
            color: rgb(10, 102, 194);
            border-width: 1px;
            border-style: solid;
            border-radius: 20px;
            border-color: rgb(10, 102, 194);
            padding-top: 11px;
            padding-bottom: 11px;
            padding-left: 24px;
            padding-right: 24px;
            font-weight: bold;
            cursor: pointer;
        }

        .save:hover{
            background-color: rgb(226, 240, 254);
            border-width: 2px;
        }

    </style>
</head>
<body>
    <button class="apply_button">Apply on company website</button>
    <button class="save">Save</button>
</body>
</html>
